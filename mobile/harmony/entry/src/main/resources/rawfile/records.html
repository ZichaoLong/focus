<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>本机离线记录</title><style>
:root{color-scheme:light dark;--ink:#192619;--muted:#56635b;--paper:#fafbf7;--line:#d9dfd5;--tint:#e4eddf;--accent:#335c3a}
@media(prefers-color-scheme:dark){:root{--ink:#e3e8df;--muted:#a7b3a7;--paper:#191e1a;--line:#3a443d;--tint:#2a382d;--accent:#b1d8b8}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}main,header{max-width:48rem;margin:auto;padding:14px 18px}header{position:sticky;top:0;z-index:1;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}h1{font-size:1.05rem;flex:1;margin:0;overflow-wrap:anywhere}h2{font-size:1.15rem;margin:.8em 0}p{margin:.65em 0;overflow-wrap:anywhere}button,select{font:inherit;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px}button:active{background:var(--tint)}button:focus-visible{outline:2px solid var(--accent)}button:disabled{opacity:.6}small,.muted{color:var(--muted);font-size:.85rem}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:.6em 0}.entry{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0}.entry span,.entry small{display:block;overflow-wrap:anywhere}.user{padding:10px 14px;background:var(--tint);border-radius:12px}.message{margin:14px 0;overflow-wrap:anywhere}.tools{margin:.7em 0}pre,table{display:block;overflow:auto;max-width:100%;padding:8px;background:var(--tint);border-radius:6px}code{font-family:monospace}td,th{padding:3px 8px;border-bottom:1px solid var(--line)}blockquote{border-left:3px solid var(--line);padding-left:.8em;margin-left:0}.tool-detail{white-space:pre-wrap}.confirm{padding:14px;border:1px solid var(--line);border-radius:10px}#status{color:var(--muted)}
.candidate{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.candidate span{min-width:0}.candidate strong,.candidate small{display:block}.candidate input,.row input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.cleanup-footer{position:sticky;bottom:0;background:var(--paper);padding:10px 0;border-top:1px solid var(--line)}.cleanup-footer button{width:100%;min-height:44px}.row select{max-width:100%}.confirm{scroll-margin-top:4rem}
</style></head><body><header><button id="back" aria-label="返回">‹ 返回</button><h1 id="title">本机离线记录</h1><button id="switch" hidden>实例</button></header><main><div id="status" role="status"></div><section id="content"></section></main><script src="records.js"></script></body></html>
